<body>
<header class="top"><div class="brand"><span class="brandmark" aria-hidden="true">AI</span><div><strong>新客多 · AI 美业获客智能体</strong><small>最终版 · 统一工作台 · 2026.11.27</small></div></div><div class="top-tools"><div class="end-switch" role="tablist" aria-label="切换演示端"><button role="tab" id="store-tab" aria-selected="true" class="on" data-end="store">门店端 App</button><button role="tab" id="admin-tab" aria-selected="false" data-end="admin">平台管理端</button></div><label class="project-control">当前项目<select id="project-select" aria-label="当前项目"></select></label><button class="btn quiet" data-action="project-form">配置项目</button></div></header>
<div class="demo-bar"><span><strong>交互演示</strong> · 实拍样例为已完成的本地试剪，后续业务流程和数据为示例；未连接设备、AI、支付或发布通道。</span><div class="actions"><button class="top-link" data-action="scope">完成范围</button><button class="top-link" data-action="reset">重置演示</button></div></div>
<main><section id="store" aria-labelledby="store-tab"><div class="store-layout"><aside class="journey"><h2>从一次服务，到一次到店</h2><p>复杂度交给系统，门店只做拍板和补充。</p><nav class="journey-list" id="journey" aria-label="门店端十环节"></nav></aside><div class="phone"><div class="phone-status"><span>09:41</span><i class="island" aria-hidden="true"></i><span>5G ▰</span></div><div class="phone-body" id="phone-body"></div><div class="phone-footer"><button data-action="prev">上一步</button><span id="step-label">门店端 · 1 / 10</span><button data-action="next">下一步</button></div><div class="homebar" aria-hidden="true"></div></div><aside class="director" id="director"></aside></div></section><section id="admin" hidden aria-labelledby="admin-tab"><div class="admin-layout"><aside class="admin-nav"><h2>平台管理 · 18 模块</h2><nav class="admin-nav-inner" id="admin-nav" aria-label="管理端十八模块"></nav></aside><div class="admin-main" id="admin-main"></div></div></section></main><footer class="footer">真实素材 · 不翻拍 · 项目可配置 · 默认手动确认发布 · 产品交付边界到客户到店</footer>
<dialog id="dialog" aria-labelledby="dialog-title"></dialog><div class="toast" id="toast" role="status" aria-live="polite"></div><input id="local-material" type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/quicktime,video/webm" class="sr-only" aria-label="选择本机原片，仅本页预览">
<script>
'use strict';
const $=s=>document.querySelector(s),E=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=name=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+({camera:'<rect x="3" y="6" width="13" height="12" rx="3"/><path d="m16 10 5-3v10l-5-3"/>',spark:'<path d="m12 3 3 6 6 3-6 3-3 6-3-6-6-3 6-3Z"/>',shield:'<path d="M12 3 4 6v6c0 5 8 9 8 9s8-4 8-9V6Z"/><path d="m8 12 3 3 5-6"/>'}[name]||'<circle cx="12" cy="12" r="8"/>')+'</svg>';
const chip=(s,t='')=>`<span class="chip ${t}">${E(s)}</span>`;
const button=(s,a,attrs='',kind='')=>`<button class="btn ${kind}" data-action="${a}" ${attrs}>${s}</button>`;
const card=(title,body,extra='')=>`<section class="card ${extra}"><h3>${title}</h3>${body}</section>`;
const table=(heads,rows)=>`<div class="table-wrap"><table><thead><tr>${heads.map(h=>`<th scope="col">${E(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const steps=['账号定位','爆款发现','镜头拆解','场景匹配','全程采集','AI 剪辑','发布','付费放大','AI 客服','三块看板'];
const modules=['客户 / 门店管理','计费与订阅','多租户数据隔离','角色权限 RBAC','门店账号管理','内容审核 / 质检','素材 / 知识库','平台数据看板','合同与分成结算','财务对账','品牌方 / 项目方管理','平台账号授权','AI 额度 / 算力','工单 / 客服','审计日志','公告 / 消息推送','帮助中心 / 培训','报表导出'];
const projects=[{id:'gmt',name:'GMT 酸性护理烫',brand:'维奈丝 VNICE',category:'烫发',knowledge:'品牌项目知识 v1 · 已核对示例',topic:'卷度与日常打理'},{id:'color',name:'染色设计',brand:'本店自有项目（示例）',category:'染发',knowledge:'门店项目知识 v1 · 已核对示例',topic:'颜色与日常护理'},{id:'scalp',name:'头皮清洁护理',brand:'其他品牌项目（示例）',category:'头皮',knowledge:'品牌项目知识 v1 · 已核对示例',topic:'清洁过程与服务体验'}];
const state={end:'store',step:1,module:1,project:'gmt',viewpoint:'项目',formula:'result',version:'B',platform:'抖音',publishMode:'manual',gates:[false,false,false],accepted:false,captureException:false,results:false,publication:false,handoff:false,autoTask:false,aiTab:'basic',faq:'project',handoffReason:'发质判断',humanPaused:false,feedbackAdded:false,schedule:false,slots:false,slot:'',intent:false,booked:false,arrived:false,traffic:'自然',age:7,task:'待采纳',role:'owner',tenant:'依格宝',layer:0,brandPending:null,brandApproved:false,reviewResult:null,ticketDone:false,logs:[],material:null,previewTick:0,previewTimer:null};
const views={项目:{focus:'项目确定经营方向，真实过程和效果提供证据。',title:p=>`这次${p.name}，先看完成后的细节`,evidence:'成品侧后方、关键过程、同次服务前态（如有）'},顾客:{focus:'从顾客真实问题进入，只有获得授权的需求和反馈才使用。',title:p=>`做${p.name}前，你最关心什么？`,evidence:'实际需求、授权反馈、同光线角度的本次对比'},设计师:{focus:'用真实设计判断形成识别，让顾客了解为什么这样做。',title:p=>`设计师如何安排这次${p.name}`,evidence:'真实讲解、操作判断、对应的项目过程'},门店:{focus:'表达服务流程与门店体验，画面避开其他顾客。',title:p=>`在依格宝，一次${p.name}怎样完成`,evidence:'接待流程、镜台与洗护位、本店环境'},品牌:{focus:'引用已确认的品牌项目资料，不把品牌话术当作效果证据。',title:p=>`${p.brand} · ${p.name}门店服务记录`,evidence:'当前项目知识、实际使用过程、授权的品牌资料'}};
const formulaDefs={result:{name:'先看结果',hook:'先看完成后的侧后细节',opening:'真实成品先呈现，再交代实际需求',rhythm:'3秒看点 / 过程证据 / 成品收尾',tag:'真实服务记录'},question:{name:'问题进入',hook:'先回答一个真实顾虑',opening:'顾客关心的问题，设计师用真实讲解回应',rhythm:'提问 / 实际解释 / 证据 / 沟通入口',tag:'同城项目答疑'},process:{name:'过程见证',hook:'这次服务做了哪些步骤',opening:'展示本次关键操作，不演出不存在的过程',rhythm:'关键动作 / 方法说明 / 成品细节',tag:'门店服务过程'}};
function P(){return projects.find(p=>p.id===state.project)||projects[0];}
function toast(s){$('#toast').textContent=s;$('#toast').classList.add('on');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').classList.remove('on'),4200);}
function log(action){state.logs.unshift({action,time:new Date().toLocaleTimeString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false})});state.logs=state.logs.slice(0,25);}
function stopPreview(){if(state.previewTimer)clearInterval(state.previewTimer);state.previewTimer=null;}
function switchEnd(end){stopPreview();state.end=end;$('#store').hidden=end!=='store';$('#admin').hidden=end!=='admin';document.querySelectorAll('[data-end]').forEach(b=>{b.classList.toggle('on',b.dataset.end===end);b.setAttribute('aria-selected',String(b.dataset.end===end));});if(end==='store')renderStore();else renderAdmin();}
function goStep(n){stopPreview();state.step=Math.max(1,Math.min(10,n));renderStore();$('#phone-body').scrollTop=0;}
function goAdmin(n){state.module=Math.max(1,Math.min(18,n));renderAdmin();}
function projectOptions(){const select=$('#project-select');select.innerHTML=projects.map(p=>`<option value="${p.id}">${E(p.name)}${p.id==='gmt'?' · 首个试点':''}</option>`).join('');select.value=state.project;}
function resetProject(id){stopPreview();if(state.material)URL.revokeObjectURL(state.material.url);Object.assign(state,{project:id,viewpoint:'项目',formula:'result',version:'B',accepted:false,results:false,publication:false,handoff:false,autoTask:false,publishMode:'manual',gates:[false,false,false],humanPaused:false,feedbackAdded:false,schedule:false,slots:false,slot:'',intent:false,booked:false,arrived:false,task:'待采纳',material:null});projectOptions();log('切换可配置项目');if(state.end==='store')renderStore();else renderAdmin();}
function modal(title,body,form=''){const d=$('#dialog');d.innerHTML=`<div class="row"><h2 id="dialog-title">${E(title)}</h2><button class="modal-close" data-action="close" aria-label="关闭弹窗">×</button></div>${form?`<form id="${form}">${body}<div class="actions">${button('取消','close','','quiet')}<button type="submit" class="btn primary">保存本页演示配置</button></div></form>`:`<div class="spaced">${body}</div><div class="actions">${button('知道了','close','','primary')}</div>`}`;d.querySelectorAll('.field').forEach((f,i)=>{const input=f.querySelector('input,select,textarea'),label=f.querySelector('label');if(input&&label){input.id='modal-field-'+i;label.htmlFor=input.id;}});d.showModal();}
function shell(n,title,subtitle,body,nextLabel){return `<div class="screen-heading"><div class="row"><span class="eyebrow">SERVICE / ${String(n).padStart(2,'0')}</span>${chip(n===5?'设备链路示意':n===10?'示例数据':'方案演示','gray')}</div><h1>${title}</h1><p>${subtitle}</p></div>${body}<div class="screen-foot">${n<10?button(nextLabel||steps[n], 'go',`data-step="${n+1}"`,'primary block'):button('回到今日内容，继续下一轮','go','data-step="2"','primary block')}<p class="meta spaced">依格宝 · 本次服务 YGB-1127-01 · ${E(P().name)}</p></div>`;}
function renderStore(){const p=P();$('#journey').innerHTML=steps.map((s,i)=>`<button class="journey-item ${state.step===i+1?'on':''}" data-action="go" data-step="${i+1}" ${state.step===i+1?'aria-current="step"':''}><span class="number">${String(i+1).padStart(2,'0')}</span>${s}</button>`).join('');$('#phone-body').innerHTML=storeScreen(state.step);$('#step-label').textContent=`门店端 · ${state.step} / 10`;$('#director').innerHTML=card('以同城到店为终点',`<div class="big-goal">1万—10万<span class="mini-label"> / 条</span></div><p>用户的播放目标，不是每条保量承诺。</p><div class="separator"></div><div class="actions">${chip('7天自然观察')}${chip('抖音优先')}${chip('三平台小规模并行','gray')}</div>`,'accent')+card('总导演为这次服务做判断',`<div class="evidence-item">经营方向<span>${E(p.name)} · ${E(p.category)} · 可配置</span></div><div class="evidence-item">表达视角<span>${E(state.viewpoint)}视角 · 同次服务共享证据</span></div><div class="evidence-item">门店日常只做拍板 + 补充<span>固定机位全程记录，只有遮挡、缺片或资料不确定时提醒。</span></div><div class="note">同一服务可产多个候选，不代表同一账号要全部发布。</div>`)+card('边界清楚，才能闭环',`<p>本产品跟进到客户到店。到店成交与升单交给 AI 销冠，复购与转介绍交给 AI 会员复购官。</p>${button('看五层知识与公式库','open-module','data-module="7"','quiet block')}`);}
function storeScreen(n){const p=P(),f=formulaDefs[state.formula],v=views[state.viewpoint];

function dataBytes(url){const raw=atob(url.slice(url.indexOf(',')+1)),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);return bytes;}
function crc32(bytes){let crc=0xffffffff;for(const b of bytes){crc^=b;for(let i=0;i<8;i++)crc=(crc>>>1)^((crc&1)?0xedb88320:0);}return (crc^0xffffffff)>>>0;}
function zipStored(entries){const enc=new TextEncoder(),parts=[],central=[];let offset=0;for(const e of entries){const name=enc.encode(e.name),data=typeof e.data==='string'?enc.encode(e.data):e.data,crc=crc32(data),h=new Uint8Array(30+name.length),v=new DataView(h.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x800,true);v.setUint16(12,23931,true);v.setUint32(14,crc,true);v.setUint32(18,data.length,true);v.setUint32(22,data.length,true);v.setUint16(26,name.length,true);h.set(name,30);parts.push(h,data);const c=new Uint8Array(46+name.length),cv=new DataView(c.buffer);cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,0x800,true);cv.setUint16(14,23931,true);cv.setUint32(16,crc,true);cv.setUint32(20,data.length,true);cv.setUint32(24,data.length,true);cv.setUint16(28,name.length,true);cv.setUint32(42,offset,true);c.set(name,46);central.push(c);offset+=h.length+data.length;}const size=central.reduce((n,c)=>n+c.length,0),end=new Uint8Array(22),v=new DataView(end.buffer);v.setUint32(0,0x06054b50,true);v.setUint16(8,entries.length,true);v.setUint16(10,entries.length,true);v.setUint32(12,size,true);v.setUint32(16,offset,true);return new Blob([...parts,...central,end],{type:'application/zip'});}

function exSend(message){
 const c=exConversation(),text=String(message).trim().slice(0,500);if(!text)return;
 c.messages.push({role:'customer',text});
 if(c.human)c.messages.push({role:'note',text:'此会话等待人工处理，AI不继续自动回复。'});
 else if(/判断|发质|适合|投诉|不满意|过敏/.test(text)){c.human=true;c.messages.push({role:'note',text:'这类判断交给负责人核实，当前会话已演示转人工并暂停自动回复。'});}
 else if(/预约|到店|想约|时间/.test(text)){c.intent=true;c.messages.push({role:'reply',text:'已记录到店意向。本示例未连接真实排班，需要门店核对设计师和时间后再确认预约。'});}
 else if(/价格|多少钱|费用|价目/.test(text))c.messages.push({role:'reply',text:'本次拍摄的具体项目和本店价目还未确认，我先请负责人核对，避免报错价格。你可以补充想了解的服务需求。'});
 else if(/GMT|品牌|项目/.test(text))c.messages.push({role:'reply',text:'仅凭这段背面画面不能确认使用了什么品牌或项目，需负责人核对本次服务记录。'});
 else if(/打理|护理|保持/.test(text))c.messages.push({role:'reply',text:'可以先记录你对日常打理的顾虑，交设计师结合实际发质和习惯说明。本条视频没有护理讲解，不凭画面补造具体方案。'});
 else c.messages.push({role:'reply',text:'收到。你可以说明最关心项目、价格还是到店安排；未确认的经营事实会交给负责人核对。'});
 renderStore();
}

  if(action==='version'){if(!EX_ASSETS.versions[b.dataset.value])return;experience.version=b.dataset.value;renderStore();return;}
  if(action==='large-video'){fmodal(experience.platform+' · '+experience.version+'实拍成片',exVideo(exCurrent(),true),'',true);return;}
  if(action==='music-copy'){exMusicCopy();return;}if(action==='cover'){const v=exCurrent();fmodal('实际封面 · '+v.platform+' '+experience.version,`<img class="case-modal-cover" src="${v.poster}" alt="实际封面">${exBtn('保存当前封面','save-cover')}`,'',true);return;}
  if(action==='save-video'){const v=exCurrent();downloadBlob('实拍-'+v.platform+'-'+experience.version+'.mp4',new Blob([dataBytes(v.video)],{type:'video/mp4'}));return;}
  if(action==='save-cover'){const v=exCurrent();downloadBlob('封面-'+v.platform+'-'+experience.version+'.jpg',new Blob([dataBytes(v.poster)],{type:'image/jpeg'}));return;}
  if(action==='save-copy'){download('文案-'+experience.platform+'-'+experience.version+'.txt',exCurrent().copy_file,'text/plain;charset=utf-8');return;}
  if(action==='copy'){if(navigator.clipboard){try{await navigator.clipboard.writeText(exCurrent().title+'\n\n'+exCurrent().copy);toast('标题和文案已复制，未发布。');}catch{toast('浏览器未允许复制，可点“保存文案”。');}}else toast('可点“保存文案”保留完整内容。');return;}
  if(action==='zip'){exZip();return;}if(action==='mode'){if(['manual','handoff','auto'].includes(b.dataset.value)){experience.mode=b.dataset.value;renderStore();}return;}
  if(action==='receive'){experience.received[exKey()]=true;renderStore();return;}
  if(action==='auto-prepare'){if(experience.checks[exKey()]&&experience.gates[exKey()]?.every(Boolean)){experience.autoReady[exKey()]=true;renderStore();}return;}
  if(action==='publication'){const key=exKey();if(!experience.checks[key]||(experience.mode==='handoff'&&!experience.received[key])||(experience.mode==='auto'&&!experience.autoReady[key]))return;experience.publications[key]={simulated:true,real_link:null};log('实拍体验中模拟登记发布，未对外发布');renderStore();return;}
  if(action==='chat-tab'){if(['basic','human','feedback','appointment'].includes(b.dataset.value)){experience.tab=b.dataset.value;renderStore();}return;}
  if(action==='question'){exSend(b.dataset.value);return;}if(action==='human'){const c=exConversation();c.human=!c.human;renderStore();return;}
  if(action==='feedback'){if(!experience.feedback.includes(b.dataset.value))experience.feedback.push(b.dataset.value);state.feedbackAdded=true;renderStore();return;}
  if(action==='intent'){exConversation().intent=true;renderStore();return;}
  if(action==='slot'){const c=exConversation();if(!c.connected)return;c.slot=b.dataset.value;c.booked=false;c.arrived=false;renderStore();return;}
  if(action==='book'){const c=exConversation();if(c.connected&&c.slot){c.intent=true;c.booked=true;c.arrived=false;c.cancelled=false;renderStore();}return;}
  if(action==='cancel'){const c=exConversation();if(c.booked){c.booked=false;c.arrived=false;c.slot='';c.cancelled=true;renderStore();}return;}
  if(action==='arrive'){const c=exConversation();if(c.booked){c.arrived=true;renderStore();}return;}
  if(action==='metrics-sample'){experience.sample=!experience.sample;renderStore();return;}
  if(action==='traffic'){if(['自然','付费'].includes(b.dataset.value)){experience.traffic=b.dataset.value;renderStore();}return;}
  if(action==='task-adopt'){if(experience.sample&&experience.age>=7&&experience.traffic==='自然'&&!exTask()){experience.tasks[experience.platform+':'+experience.traffic]={status:'待执行',owner:'流量负责人（示例）',window:7,execution:''};renderStore();}return;}
  if(action==='task-start'){if(exTask()?.status==='待执行'){exTask().status='执行中';renderStore();}return;}
  if(action==='task-evidence'){if(exTask()?.status!=='执行中')return;fmodal('记录演示执行证据',`<p class="muted">这里只记录流程示例，不会重新剪辑视频，也不确认整改有效。</p><div class="field"><label>演示执行内容与产物说明</label><textarea name="evidence" required maxlength="500"></textarea></div><label class="case-check"><input name="confirmed" type="checkbox" required>我知道这是演示执行记录，不是真实新版本或流量证据</label>`,'case-task-form');return;}
  if(action==='compare'){exCompare();return;}if(action==='report'){exReport();return;}
 }catch(error){toast('本页操作未完成，请重试：'+error.message);}
});
document.addEventListener('change',e=>{
 if(e.target.id==='case-review'){experience.checks[exKey()]=e.target.checked;renderStore();return;}
 if(e.target.hasAttribute('data-case-gate')){const gates=experience.gates[exKey()]||(experience.gates[exKey()]=[false,false,false]);gates[Number(e.target.dataset.caseGate)]=e.target.checked;if(!gates.every(Boolean))experience.autoReady[exKey()]=false;renderStore();return;}
 if(e.target.id==='case-schedule'){const c=exConversation();c.connected=e.target.checked;if(!c.connected){c.slot='';c.booked=false;c.arrived=false;}renderStore();return;}
 if(e.target.id==='case-age'){experience.age=Number(e.target.value);renderStore();return;}
 if(e.target.id==='local-material'){Object.assign(experience,exFresh());renderStore();}
});
document.addEventListener('submit',e=>{
 if(e.target.id==='case-chat-form'){e.preventDefault();const text=new FormData(e.target).get('message');exSend(text);}
 if(e.target.id==='case-task-form'){e.preventDefault();const d=new FormData(e.target),text=String(d.get('evidence')||'').trim();if(exTask()?.status!=='执行中'||!text||!d.has('confirmed'))return;exTask().execution=text;exTask().status='待复验';$('#dialog').close();renderStore();}
});
document.addEventListener('click',e=>{if(e.target.closest('#admin-tab'))document.body.classList.remove('case-active');});
renderStore();

</script>
<script id="friend-sharing">
/* Hosted media loads on demand. Original business handlers and export bytes are retained. */
const shareByteCache=new Map(),shareFetches=new Map(),shareDataBytesBefore=dataBytes;
dataBytes=function(url){if(url.startsWith('data:'))return shareDataBytesBefore(url);if(!shareByteCache.has(url))throw Error('资料还未准备，请重试下载');return shareByteCache.get(url);};
async function shareRead(url){
 if(url.startsWith('data:')||shareByteCache.has(url))return;
 if(!shareFetches.has(url))shareFetches.set(url,(async()=>{const response=await fetch(url);if(!response.ok)throw Error('下载资料暂时不可用');shareByteCache.set(url,new Uint8Array(await response.arrayBuffer()));})().finally(()=>shareFetches.delete(url)));
 await shareFetches.get(url);
}
function shareDownloadUrls(b){
 const c=b.dataset.case,f=b.dataset.fusion;
 if(c==='zip')return EX_ASSETS.versions[experience.version].flatMap(v=>[v.video,v.poster]);
 if(c==='save-video')return [exCurrent().video];if(c==='save-cover')return [exCurrent().poster];
 if(f==='history-zip')return fusionAssets.samples.flatMap(v=>[v.video,v.poster]);
 const sample=fusionAssets.samples.find(v=>v.id===b.dataset.id);
 if(f==='history-video'&&sample)return [sample.video];if(f==='history-cover'&&sample)return [sample.poster];return [];
}
document.addEventListener('click',async function(e){
 const a=e.target.closest('a[href="#requires-local-workspace"]');
 if(a){e.preventDefault();e.stopImmediatePropagation();fmodal('真实制作工作区说明','<p>当前是可转发的交互演示。已完成的实拍视频、音乐、封面和文案可以查看，其他业务流程为本页示例。</p><p>制作新的手机素材需要连接真实后台；这个分享页不访问发布者或访客电脑上的本地程序。</p>');return;}
 const b=e.target.closest('[data-case],[data-fusion]');if(!b||b.disabled)return;
 const urls=shareDownloadUrls(b),missing=urls.filter(u=>!u.startsWith('data:')&&!shareByteCache.has(u));if(!missing.length)return;
 e.preventDefault();e.stopImmediatePropagation();b.disabled=true;
 const context=JSON.stringify([state.project,experience.version,experience.platform]);
 try{toast('正在准备下载资料，请稍候。');await Promise.all(missing.map(shareRead));b.disabled=false;
  if(!b.isConnected||context!==JSON.stringify([state.project,experience.version,experience.platform])){toast('资料已准备，请在当前成片重新点击下载。');return;}b.click();
 }catch{toast('资料未下载完成，请检查网络后重试。');}finally{b.disabled=false;}
},true);

</script>
